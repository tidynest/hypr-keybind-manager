# cargo-deny configuration, run by the local pre-push gate and usable in CI.
# cargo-deny 0.20 rejects every licence that is not listed, so the permissive
# licences of the dependency tree are listed here. Add to this list when a new
# dependency brings a new one; never add a copyleft licence without a decision.
#
# No copyleft licence is allowed. r-efi is MIT OR Apache-2.0 OR LGPL-2.1, and
# the MIT alternative satisfies the check.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
