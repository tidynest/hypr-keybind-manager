# cargo-deny configuration, run by the local pre-push gate and usable in CI.
# cargo-deny 0.20 rejects every licence that is not listed, so the permissive
# licences of the dependency tree are listed here. Add to this list when a new
# dependency brings a new one; never add a copyleft licence without a decision.
#
# Copyleft entries already present before this file existed:
#   GPL-3.0-or-later:  hyprland@0.3.13,hyprland-macros@0.3.4
#   LGPL-2.1-or-later: r-efi@5.3.0

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
